<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#dc2626',
                        secondary: '#991b1b',
                        dark: '#0a0a0a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-dark via-gray-900 to-secondary min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-5xl font-bold text-primary mb-2 drop-shadow-lg">Task Manager</h1>
            <p class="text-gray-400">Organize your day efficiently</p>
        </header>

        <div class="bg-gray-800 rounded-lg shadow-2xl p-6 mb-6 border border-primary/30">
            <div class="flex gap-3 mb-4">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Enter a new task..." 
                    class="flex-1 px-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/50 transition"
                    onkeypress="if(event.key==='Enter') addTask()"
                >
                <select id="prioritySelect" class="px-4 py-3 bg-gray-900 text-white border border-gray-700 rounded-lg focus:outline-none focus:border-primary">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button 
                    onclick="addTask()" 
                    class="px-6 py-3 bg-primary hover:bg-secondary text-white font-semibold rounded-lg transition transform hover:scale-105 shadow-lg"
                >
                    Add
                </button>
            </div>
            
            <div class="flex gap-2 flex-wrap">
                <button onclick="filterTasks('all')" class="filter-btn px-4 py-2 bg-gray-700 hover:bg-primary text-white rounded-lg text-sm transition">All</button>
                <button onclick="filterTasks('active')" class="filter-btn px-4 py-2 bg-gray-700 hover:bg-primary text-white rounded-lg text-sm transition">Active</button>
                <button onclick="filterTasks('completed')" class="filter-btn px-4 py-2 bg-gray-700 hover:bg-primary text-white rounded-lg text-sm transition">Completed</button>
                <button onclick="filterTasks('high')" class="filter-btn px-4 py-2 bg-gray-700 hover:bg-primary text-white rounded-lg text-sm transition">High Priority</button>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search tasks..." 
                    oninput="searchTasks()"
                    class="flex-1 min-w-[200px] px-4 py-2 bg-gray-900 text-white border border-gray-700 rounded-lg focus:outline-none focus:border-primary text-sm"
                >
            </div>
        </div>

        <div id="taskList" class="space-y-3"></div>

        <div id="emptyState" class="text-center py-12 hidden">
            <p class="text-gray-500 text-lg">No tasks yet. Add one to get started!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
